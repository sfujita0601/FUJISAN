[project]
name = "fujisan"
version = "0.2.0"
description = "FUJISAN: prediction of protein functional identity from sequence and structural similarity features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.6",
    "lightgbm==4.6.0",          # pinned for reproducible inference; fixes CVE-2024-43598; the updated model was trained with 4.6.0
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "python-igraph>=0.10",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "shap>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
run_FUJISAN = 'FUJISAN.run_FUJISAN:main'
fujisan = 'FUJISAN.cli:main'

[tool.hatch.build.targets.wheel]
packages = ["FUJISAN"]

# Model files are shipped inside the package (FUJISAN/model) so that an installed
# `fujisan` / `run_FUJISAN` finds them via importlib.resources (FUJISAN/models.py).
[tool.hatch.build.targets.wheel.force-include]
"model" = "FUJISAN/model"

[dependency-groups]
dev = [
    "pytest>=9.0.3",            # GHSA-6w46-j5rx-g56g
]

# Minimum versions of indirect dependencies (pulled in by matplotlib) that fix security advisories:
# Pillow 13.0.0 (54 advisories, needs Python >= 3.11), fontTools 4.60.2 (GHSA-768j-98cg-p3fv).
[tool.uv]
constraint-dependencies = [
    "pillow>=13.0.0",
    "fonttools>=4.60.2",
]
